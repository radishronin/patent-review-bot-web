<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patent Review</title>

  <!-- mammoth.js: converts .docx to plain text entirely client-side -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <!-- jszip: used by docx-parser to unzip .docx files client-side -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base:        #0e0e0e;
      --bg-surface:     #161616;
      --bg-raised:      #1f1f1f;
      --border:         #2e2e2e;
      --border-active:  #6b8cba;
      --text-primary:   #e8e4dc;
      --text-secondary: #8a8580;
      --text-muted:     #4a4845;
      --accent:         #4a6fa5;
      --accent-light:   #6b8cba;
      --success:        #4a7c59;
      --success-light:  #6aad80;
      --warning:        #7a6030;
      --warning-light:  #c8a050;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 2rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      margin-top: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    header p {
      margin-top: 0.6rem;
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--border);
      margin: 1.2rem auto;
    }

    /* ── Drop zone ─────────────────────────────────── */
    .drop-zone {
      width: 100%;
      max-width: 640px;
      background: var(--bg-surface);
      border: 1.5px dashed var(--border);
      border-radius: 4px;
      padding: 3.5rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      cursor: default;
      transition: border-color 0.2s ease, background-color 0.2s ease;
      position: relative;
      user-select: none;
    }

    .drop-zone.drag-over {
      border-color: var(--border-active);
      background-color: var(--bg-raised);
    }

    .drop-zone.accepted {
      border-style: solid;
      border-color: var(--success);
      background-color: var(--bg-raised);
    }

    .drop-icon {
      width: 48px;
      height: 48px;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }

    .drop-zone.drag-over .drop-icon,
    .drop-zone.accepted .drop-icon {
      opacity: 0.6;
    }

    .drop-zone.accepted .drop-icon path {
      stroke: var(--success-light);
    }

    .drop-label {
      font-size: 1rem;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.6;
    }

    .drop-label span {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      font-style: italic;
    }

    .drop-zone.drag-over .drop-label {
      color: var(--text-primary);
    }

    /* ── File result card ──────────────────────────── */
    .file-result {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 1.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.25rem 1.5rem;
      align-items: center;
      gap: 1.25rem;
    }

    .file-result.visible {
      display: flex;
    }

    .file-result-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      opacity: 0.7;
    }

    .file-result-icon path {
      stroke: var(--success-light);
    }

    .file-details {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 0.95rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    .file-meta {
      margin-top: 0.25rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .file-badge {
      flex-shrink: 0;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--success);
      color: var(--success-light);
      border-radius: 2px;
    }

    /* ── Status / error messages ───────────────────── */
    .status-msg {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 1rem;
      font-size: 0.82rem;
      font-style: italic;
      text-align: center;
    }

    .status-msg.visible   { display: block; }
    .status-msg.error     { color: #b06060; }
    .status-msg.working   { color: var(--text-muted); }

    /* ── Analyzing indicator ──────────────────────── */
    .analyzing-indicator {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 2rem;
      text-align: center;
      padding: 2.5rem 1rem;
      animation: analyzing-fade 1.8s ease-in-out infinite alternate;
    }

    .analyzing-indicator.visible { display: block; }

    @keyframes analyzing-fade {
      from { opacity: 0.45; }
      to   { opacity: 1; }
    }

    .analyzing-text {
      font-size: 1.1rem;
      color: var(--text-secondary);
      font-style: italic;
      letter-spacing: 0.04em;
    }

    .analyzing-text::after {
      content: '';
      animation: analyzing-dots 1.6s steps(4, end) infinite;
    }

    @keyframes analyzing-dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
    }

    .analyzing-sub {
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    /* ── Overview dashboard ────────────────────────── */
    .overview-dashboard {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 1.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
    }

    .overview-dashboard.visible { display: block; }

    .overview-header {
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .overview-title {
      font-size: 1.05rem;
      font-weight: normal;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      line-height: 1.4;
    }

    .overview-summary {
      margin-top: 0.45rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.55;
    }

    .overview-error {
      font-size: 0.85rem;
      color: #b06060;
      font-style: italic;
      margin-bottom: 0.75rem;
    }

    .retry-btn {
      font-family: inherit;
      font-size: 0.75rem;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: border-color 0.2s, color 0.2s;
    }

    .retry-btn:hover {
      border-color: var(--border-active);
      color: var(--text-primary);
    }

    /* ── Risk grid ─────────────────────────────────── */
    .risk-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }

    .risk-card {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.9rem 1rem;
    }

    .risk-card-label {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
    }

    .risk-badge {
      display: inline-block;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.18rem 0.5rem;
      border-radius: 2px;
      margin-bottom: 0.55rem;
      border: 1px solid;
    }

    .risk-badge.LOW {
      border-color: var(--success);
      color: var(--success-light);
    }

    .risk-badge.MED {
      border-color: var(--warning);
      color: var(--warning-light);
    }

    .risk-badge.HI {
      border-color: #8b3030;
      color: #c05050;
    }

    .risk-headline {
      font-size: 0.82rem;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .risk-para-refs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.55rem;
    }

    .risk-para-ref {
      font-size: 0.7rem;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.1rem 0.35rem;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      position: relative;
    }

    /* ── Token usage footer ────────────────────────── */
    .token-usage {
      text-align: right;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    /* ── Drill-down button ─────────────────────────── */
    .drill-down-btn {
      display: inline-block;
      margin-top: 0.6rem;
      padding: 0.3rem 0.7rem;
      font-size: 0.72rem;
      font-family: 'Georgia', 'Times New Roman', serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 2px;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .drill-down-btn:hover {
      border-color: var(--border-active);
      color: var(--text-primary);
    }
    .drill-down-btn.loading {
      pointer-events: none;
      opacity: 0.5;
    }

    /* ── Drill-down panel ──────────────────────────── */
    .drill-down-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1rem 1.25rem;
      margin-top: 0.35rem;
      margin-bottom: 0.4rem;
      max-height: 400px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .drill-down-output {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Paragraph ref tooltip ─────────────────────── */
    .para-tooltip {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0.5rem 0.65rem;
      font-size: 0.75rem;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 320px;
      width: max-content;
      white-space: normal;
      pointer-events: none;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* ── Paragraph ref popover ─────────────────────── */
    .para-popover {
      position: fixed;
      background: var(--bg-surface);
      border: 1px solid var(--border-active);
      border-radius: 4px;
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--text-primary);
      line-height: 1.6;
      max-width: 500px;
      max-height: 250px;
      overflow-y: auto;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .para-popover-number {
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: var(--accent-light);
      margin-bottom: 0.3rem;
    }

    /* ── Validation result ─────────────────────────── */
    .validation-result {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1rem 1.25rem;
    }

    .validation-result.visible { display: block; }

    .validation-result .val-errors {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .validation-result .val-errors li {
      font-size: 0.82rem;
      color: #b06060;
      font-style: italic;
      padding: 0.2rem 0;
      letter-spacing: 0.01em;
    }

    .validation-result .val-errors li::before {
      content: '✕  ';
      font-style: normal;
    }

    .validation-result .val-warnings {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .validation-result .val-warnings li {
      font-size: 0.82rem;
      color: var(--warning-light);
      font-style: italic;
      padding: 0.2rem 0;
      letter-spacing: 0.01em;
    }

    .validation-result .val-warnings li::before {
      content: '⚠  ';
      font-style: normal;
    }

    .validation-result .val-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 0.5rem;
    }

    .validation-result .val-warnings + .val-meta,
    .validation-result .val-errors + .val-meta {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    /* ── Footer ────────────────────────────────────── */
    footer {
      margin-top: 3.5rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Patent Review</h1>
    <div class="divider"></div>
    <p>Intelligent analysis for patent applications</p>
  </header>

  <!-- ── Phase 1: Drop zone ─────────────────────────── -->
  <div class="drop-zone" id="dropZone" role="region" aria-label="File drop zone">
    <svg class="drop-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 6h16l10 10v26H12V6z" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M28 6v10h10" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 22h12M18 28h12M18 34h8" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <p class="drop-label">
      Drop your patent document here
      <span>.docx files only</span>
    </p>
  </div>

  <!-- ── Phase 1 result: file confirmation card ──────── -->
  <div class="file-result" id="fileResult">
    <svg class="file-result-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 6h12l8 8v16H8V6z" stroke="var(--success-light)" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M20 6v8h8" stroke="var(--success-light)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 20l3.5 3.5L24 15" stroke="var(--success-light)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="file-details">
      <div class="file-name" id="fileName"></div>
      <div class="file-meta" id="fileMeta"></div>
    </div>
    <div class="file-badge">Received</div>
  </div>

  <!-- ── Phase 1.5: Validation result ────────────────── -->
  <div class="validation-result" id="validationResult"></div>

  <!-- ── Shared status / error line ──────────────────── -->
  <div class="status-msg" id="statusMsg"></div>

  <!-- ── Phase 2: Analyzing indicator ─────────────────── -->
  <div class="analyzing-indicator" id="analyzingIndicator">
    <div class="analyzing-text" id="analyzingText">Analyzing</div>
    <div class="analyzing-sub">Performing structured patent review</div>
  </div>

  <!-- ── Phase 3: Overview Dashboard ──────────────────── -->
  <div class="overview-dashboard" id="overviewDashboard">
    <div class="overview-header" id="overviewHeader"></div>
    <div class="risk-grid"       id="riskGrid"></div>
    <div class="token-usage"     id="tokenUsage"></div>
  </div>

  <footer>Patent Review System &mdash; Prototype</footer>

  <script>
    // =============================================================
    // CONFIG
    // TODO: Replace with your deployed Workers URL after running `wrangler deploy`.
    //       Format: https://patent-review-proxy.<your-subdomain>.workers.dev
    //       The API key lives in Cloudflare as a secret — never in this file.
    // =============================================================
    const PROXY_URL = 'https://patent-review-proxy.patent-review-bot.workers.dev';

    const MODEL = 'claude-opus-4-6'; // Most capable model for legal analysis

    // =============================================================
    // LLM PROVIDER ABSTRACTION
    // Swap out this object to change providers without touching
    // the rest of the application logic.
    // =============================================================
    const LLMProvider = {
      /**
       * Send a user message and receive a streamed text response.
       * Yields text chunks via onChunk as they arrive.
       * Returns token usage captured from message_start / message_delta events.
       *
       * @param {string}   userMessage
       * @param {Function} onChunk
       * @param {{ maxTokens?: number, system?: string }} [opts]
       * @returns {Promise<{ inputTokens: number, outputTokens: number }>}
       */
      async streamMessage(userMessage, onChunk, { maxTokens = 2048, system = null } = {}) {
        const body = {
          model:      MODEL,
          max_tokens: maxTokens,
          stream:     true,
          messages:   [{ role: 'user', content: userMessage }],
        };
        if (system) body.system = system;

        const response = await fetch(PROXY_URL, {
          method:  'POST',
          headers: { 'content-type': 'application/json' },
          body:    JSON.stringify(body),
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`API error ${response.status}: ${text}`);
        }

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = '';
        let   inputTokens  = 0;
        let   outputTokens = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split('\n\n');
          buffer = events.pop();

          for (const event of events) {
            const dataLine = event.split('\n').find(l => l.startsWith('data:'));
            if (!dataLine) continue;

            const raw = dataLine.slice(5).trim();
            if (raw === '[DONE]') return { inputTokens, outputTokens };

            let parsed;
            try { parsed = JSON.parse(raw); } catch { continue; }

            if (parsed.type === 'message_start') {
              inputTokens = parsed.message?.usage?.input_tokens || 0;
            }
            if (parsed.type === 'message_delta') {
              outputTokens = parsed.usage?.output_tokens || 0;
            }
            if (parsed.type === 'content_block_delta' &&
                parsed.delta?.type === 'text_delta') {
              onChunk(parsed.delta.text);
            }
          }
        }

        return { inputTokens, outputTokens };
      },

      /**
       * Make a non-streaming call and parse the response text as JSON.
       * Strips any markdown code fences before parsing.
       *
       * @param {string} userMessage
       * @param {{ maxTokens?: number, system?: string }} [opts]
       * @returns {Promise<{ parsed: object, usage: { inputTokens: number, outputTokens: number } }>}
       */
      async sendJSON(userMessage, { maxTokens = 1024, system = null } = {}) {
        const body = {
          model:      MODEL,
          max_tokens: maxTokens,
          stream:     false,
          messages:   [{ role: 'user', content: userMessage }],
        };
        if (system) body.system = system;

        const response = await fetch(PROXY_URL, {
          method:  'POST',
          headers: { 'content-type': 'application/json' },
          body:    JSON.stringify(body),
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(`API error ${response.status}: ${text}`);
        }

        const data  = await response.json();
        const text  = (data.content || [])
          .filter(b => b.type === 'text')
          .map(b => b.text)
          .join('');
        const usage = {
          inputTokens:  data.usage?.input_tokens  || 0,
          outputTokens: data.usage?.output_tokens || 0,
        };

        // Strip markdown fences if the model wrapped the JSON
        const clean  = text.replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
        const parsed = JSON.parse(clean);

        return { parsed, usage };
      },
    };

    // =============================================================
    // PROMPT
    // =============================================================

    const OVERVIEW_SYSTEM_PROMPT =
      'You are a patent attorney assistant performing triage-level review of patent applications. ' +
      'Return ONLY valid JSON with no markdown fencing, no preamble, no explanation — just the JSON object.';

    const REVIEW_STRUCTURE = `Structure your analysis under four headings:

## §101 — Subject Matter Eligibility
Assess whether the claimed invention falls within a statutory category (process, machine, manufacture, or composition of matter) and whether it is directed to patent-eligible subject matter under Alice/Mayo.

## §102 — Novelty
Identify any claim elements or combinations that may lack novelty. Note any apparent prior art concerns based on the document's own disclosures or well-known public domain knowledge.

## §103 — Obviousness
Evaluate whether the claimed invention would have been obvious to a person of ordinary skill in the art (POSITA) at the time of filing. Consider motivation to combine, secondary considerations, etc.

## §112 — Written Description & Enablement
Review whether the specification adequately supports the claims (written description) and whether it enables a POSITA to make and use the invention without undue experimentation.

Conclude with a brief **Summary of Key Risks** and suggested next steps.`;

    /**
     * Build the LLM review prompt.
     * Accepts either a plain string (mammoth fallback) or a ParsedPatentDocument
     * (structured parser path). In the structured case the prompt includes
     * document metadata and instructs the model to cite [XXXX] paragraph numbers.
     *
     * @param {string | object} docTextOrStructured
     * @returns {string}
     */
    function buildFullReviewPrompt(docTextOrStructured) {

      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function setStatus(msg, type /* 'error' | 'working' | '' */) {
      statusMsg.textContent = msg;
      statusMsg.className   = 'status-msg' + (msg ? ' visible' : '');
      if (type) statusMsg.classList.add(type);
    }

    // =============================================================
    // MODULE-LEVEL STATE
    // =============================================================
    let currentParsedDoc = null;   // ParsedPatentDocument from the structured parser
    let currentDocText   = null;   // Raw text (fullTextWithNumbers or mammoth fallback)
    let currentOverview  = null;   // Parsed JSON overview from the LLM

    // =============================================================
    // CORE FLOW
    // =============================================================

    /** Append the metadata summary to #validationResult when we have a structured doc. */
    function appendRichMeta(parsedDoc) {
      const claimsSection = parsedDoc.sections.find(s => s.type === 'claims');
      const claimCount    = claimsSection ? claimsSection.claims.length : 0;

      const line1 = document.createElement('div');
      line1.className = 'val-meta';
      line1.textContent =
        parsedDoc.metadata.totalNumberedParagraphs + ' numbered paragraph' +
        (parsedDoc.metadata.totalNumberedParagraphs !== 1 ? 's' : '') +
        ' \u00b7 ~' + parsedDoc.metadata.estimatedTokenCount.toLocaleString() + ' tokens' +
        (claimCount ? ' \u00b7 ' + claimCount + ' claim' + (claimCount !== 1 ? 's' : '') : '');
      validationResult.appendChild(line1);

      const detectedHeadings = parsedDoc.sections
        .filter(s => s.type === 'section' && s.heading)
        .map(s => s.heading);
      if (detectedHeadings.length > 0) {
        const line2 = document.createElement('div');
        line2.className = 'val-meta';
        line2.style.marginTop = '0.2rem';
        line2.textContent = detectedHeadings.join(' \u00b7 ');
        validationResult.appendChild(line2);
      }
    }

    /** Append the basic (regex-based) metadata summary. */
    function appendBasicMeta(metadata) {
      const metaEl = document.createElement('div');
      metaEl.className = 'val-meta';
      metaEl.textContent =
        metadata.paragraphCount + ' numbered paragraph' +
        (metadata.paragraphCount !== 1 ? 's' : '') +
        ' \u00b7 ~' + metadata.estimatedTokenCount.toLocaleString() + ' tokens';
      validationResult.appendChild(metaEl);
    }

    async function handleFile(file) {
      // ── Clear previous results ─────────────────────────────────
      currentParsedDoc = null;
      currentDocText   = null;
      currentOverview  = null;
      validationResult.className = 'validation-result';
      validationResult.innerHTML = '';
      overviewDashboard.style.display = 'none';
      analyzingIndicator.classList.remove('visible');
      tokenUsage.input = 0;
      tokenUsage.output = 0;
      tokenUsageEl.textContent = '';

      // ── Validate file type ─────────────────────────────────────
      const isDocx = file.name.toLowerCase().endsWith('.docx') ||
                     file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
      if (!isDocx) {
        setStatus('Only .docx files are supported. Please drop a Word document.', 'error');
        fileResult.classList.remove('visible');
        dropZone.classList.remove('drag-over', 'accepted');
        return;
      }

      // ── Phase 1: show file confirmation ───────────────────────
      setStatus('');
      fileNameEl.textContent = file.name;
      fileMetaEl.textContent = formatBytes(file.size);
      fileResult.classList.add('visible');
      dropZone.classList.remove('drag-over');
      dropZone.classList.add('accepted');

      // ── Phase 2a: read bytes, try structured parser first ─────
      setStatus('Extracting document text\u2026', 'working');

      let arrayBuffer;
      try {
        arrayBuffer = await file.arrayBuffer();
      } catch (err) {
        setStatus('Failed to read document: ' + err.message, 'error');
        return;
      }

      let parsedDoc = null;
      let docText   = null;

      try {
        parsedDoc = await parsePatentDocx(arrayBuffer);
      } catch (err) {
        console.warn('Structured parser failed, falling back to mammoth:', err);
      }

      if (parsedDoc) {
        // Structured parse succeeded — use fullTextWithNumbers as the text
        docText = parsedDoc.fullTextWithNumbers;
        currentParsedDoc = parsedDoc;
        // Enrich the file card with the detected title
        if (parsedDoc.title) {
          fileMetaEl.textContent = parsedDoc.title + ' \u00b7 ' + formatBytes(file.size);
        }
      } else {
        // Fallback: mammoth plain-text extraction
        try {
          const result = await mammoth.extractRawText({ arrayBuffer });
          docText = result.value.trim();
        } catch (err) {
          setStatus('Failed to read document: ' + err.message, 'error');
          return;
        }
      }

      if (!docText) {
        setStatus('Document appears to be empty or could not be parsed.', 'error');
        return;
      }
      currentDocText = docText;

      // ── Phase 1.5: validate patent structure ──────────────────
      const validation = validatePatentDocument(docText);
      const { isValid, errors: valErrors, warnings: valWarnings, metadata } = validation;

      if (!isValid) {
        const ul = document.createElement('ul');
        ul.className = 'val-errors';
        valErrors.forEach(msg => {
          const li = document.createElement('li'); li.textContent = msg; ul.appendChild(li);
        });
        validationResult.appendChild(ul);
        validationResult.classList.add('visible');
        setStatus('');
        return;
      }

      // Warnings list (if any)
      if (valWarnings.length > 0) {
        const ul = document.createElement('ul');
        ul.className = 'val-warnings';
        valWarnings.forEach(msg => {
          const li = document.createElement('li'); li.textContent = msg; ul.appendChild(li);
        });
        validationResult.appendChild(ul);
      }

      // Metadata summary — richer when structured parse succeeded
      if (parsedDoc) {
        appendRichMeta(parsedDoc);
      } else {
        appendBasicMeta(metadata);
      }
      validationResult.classList.add('visible');

      // ── Phase 2b: send to LLM, get structured overview ────────
      setStatus('Sending to model for analysis\u2026', 'working');
      overviewDashboard.style.display = 'none';
      analyzingIndicator.classList.add('visible');
      analyzingTextEl.textContent = 'Analyzing';

      const prompt = buildOverviewPrompt(parsedDoc || docText);

      let result = null;
      try {
        // First attempt
        result = await LLMProvider.sendJSON(prompt, { maxTokens: 1024, system: OVERVIEW_SYSTEM_PROMPT });
      } catch (firstErr) {
        // Single retry
        try {
          analyzingTextEl.textContent = 'Retrying';
          result = await LLMProvider.sendJSON(prompt, { maxTokens: 1024, system: OVERVIEW_SYSTEM_PROMPT });
        } catch (secondErr) {
          analyzingIndicator.classList.remove('visible');
          setStatus('Analysis failed: ' + secondErr.message, 'error');
          return;
        }
      }

      analyzingIndicator.classList.remove('visible');
      addUsage(result.usage);
      renderOverviewDashboard(result.parsed);
      setStatus('');
    }

    function renderOverviewDashboard(overview) {
      currentOverview = overview;

      // Header: title + summary
      overviewHeaderEl.innerHTML = '';
      if (overview.title) {
        const titleEl = document.createElement('div');
        titleEl.className = 'overview-title';
        titleEl.textContent = overview.title;
        overviewHeaderEl.appendChild(titleEl);
      }
      if (overview.summary) {
        const summaryEl = document.createElement('div');
        summaryEl.className = 'overview-summary';
        summaryEl.textContent = overview.summary;
        overviewHeaderEl.appendChild(summaryEl);
      }

      // Remove any existing drill-down panels
      overviewDashboard.querySelectorAll('.drill-down-panel').forEach(el => el.remove());

      // Risk grid
      riskGridEl.innerHTML = '';
      const RISK_LABELS = {
        '101': '\u00a7\u202f101 \u2014 Eligibility',
        '102': '\u00a7\u202f102 \u2014 Novelty',
        '103': '\u00a7\u202f103 \u2014 Obviousness',
        '112': '\u00a7\u202f112 \u2014 Enablement',
      };

      const risks = overview.risks || {};
      Object.entries(RISK_LABELS).forEach(([key, label]) => {
        const risk = risks[key] || { level: 'LOW', headline: '', paragraphs: [] };
        const level = (risk.level || 'LOW').toUpperCase();

        const card = document.createElement('div');
        card.className = 'risk-card';
        card.dataset.section = key;

        const labelEl = document.createElement('div');
        labelEl.className = 'risk-card-label';
        labelEl.textContent = label;
        card.appendChild(labelEl);

        const badge = document.createElement('span');
        badge.className = 'risk-badge ' + level;
        badge.textContent = level;
        card.appendChild(badge);

        if (risk.headline) {
          const hl = document.createElement('div');
          hl.className = 'risk-headline';
          hl.textContent = risk.headline;
          card.appendChild(hl);
        }

        if (Array.isArray(risk.paragraphs) && risk.paragraphs.length > 0) {
          const refs = document.createElement('div');
          refs.className = 'risk-para-refs';
          risk.paragraphs.forEach(ref => {
            const span = document.createElement('span');
            span.className = 'risk-para-ref';
            span.textContent = ref;

            // Tooltip on hover
            let tooltipTimeout = null;
            span.addEventListener('mouseenter', () => {
              tooltipTimeout = setTimeout(() => {
                const text = getParagraphText(ref);
                if (!text) return;
                const tip = document.createElement('div');
                tip.className = 'para-tooltip';
                tip.textContent = text.length > 150 ? text.slice(0, 150) + '\u2026' : text;
                span.appendChild(tip);
              }, 200);
            });
            span.addEventListener('mouseleave', () => {
              clearTimeout(tooltipTimeout);
              const tip = span.querySelector('.para-tooltip');
              if (tip) tip.remove();
            });

            // Popover on click
            span.addEventListener('click', (e) => {
              e.stopPropagation();
              // Close any existing popover
              const existing = document.querySelector('.para-popover');
              if (existing) {
                existing.remove();
                if (existing._sourceSpan === span) return; // toggle off
              }

              const text = getParagraphText(ref);
              if (!text) return;

              const popover = document.createElement('div');
              popover.className = 'para-popover';
              popover._sourceSpan = span;

              const numEl = document.createElement('div');
              numEl.className = 'para-popover-number';
              numEl.textContent = ref;
              popover.appendChild(numEl);

              const body = document.createElement('div');
              body.textContent = text;
              popover.appendChild(body);

              document.body.appendChild(popover);

              // position:fixed → coords are viewport-relative; no scroll offset needed
              const rect = span.getBoundingClientRect();
              let top  = rect.bottom + 6;
              let left = Math.max(8, Math.min(rect.left, window.innerWidth - 510));
              // Flip above the span if the popover would overflow below the viewport
              if (top + 260 > window.innerHeight) {
                top = Math.max(8, rect.top - 260);
              }
              popover.style.top  = top + 'px';
              popover.style.left = left + 'px';

              // Click outside to close
              const closePopover = (ev) => {
                if (!popover.contains(ev.target)) {
                  popover.remove();
                  document.removeEventListener('click', closePopover);
                }
              };
              document.addEventListener('click', closePopover);
            });

            refs.appendChild(span);
          });
          card.appendChild(refs);
        }

        // Drill-down button for MED and HI risk cards
        if (level === 'MED' || level === 'HI') {
          const btn = document.createElement('button');
          btn.className = 'drill-down-btn';
          btn.textContent = 'Details';
          btn.addEventListener('click', () => handleDrillDown(key));
          card.appendChild(btn);
        }

        riskGridEl.appendChild(card);
      });

      // Create drill-down panels for all four sections (in order), insert before tokenUsage
      const tokenUsageDiv = overviewDashboard.querySelector('.token-usage');
      Object.keys(RISK_LABELS).forEach(key => {
        const panel = document.createElement('div');
        panel.className = 'drill-down-panel';
        panel.id = 'drillPanel-' + key;
        panel.style.display = 'none';
        const pre = document.createElement('pre');
        pre.className = 'drill-down-output';
        panel.appendChild(pre);
        overviewDashboard.insertBefore(panel, tokenUsageDiv);
      });

      overviewDashboard.style.display = 'block';
    }

    /**
     * Look up a paragraph's full text from the structured document by its [XXXX] number.
     * Returns null if not found or no structured doc is loaded.
     */
    function getParagraphText(paraNumber) {
      if (!currentParsedDoc) return null;
      for (const section of currentParsedDoc.sections) {
        if (!section.paragraphs) continue;
        for (const p of section.paragraphs) {
          if (p.number === paraNumber) return p.text;
        }
      }
      return null;
    }

    /**
     * Extract paragraphs matching the given [XXXX] numbers from the current document.
     * Falls back to line-by-line search of currentDocText when no structured doc.
     *
     * @param {string[]} paraNumbers
     * @returns {string}
     */
    function extractParagraphsByNumber(paraNumbers) {
      if (!paraNumbers || paraNumbers.length === 0) return '';

      const lines = [];

      if (currentParsedDoc) {
        paraNumbers.forEach(ref => {
          const text = getParagraphText(ref);
          if (text) lines.push(ref + ' ' + text);
        });
      } else if (currentDocText) {
        const docLines = currentDocText.split('\n');
        paraNumbers.forEach(ref => {
          const match = docLines.find(l => l.trimStart().startsWith(ref));
          if (match) lines.push(match.trim());
        });
      }

      return lines.join('\n');
    }

    /**
     * Handle a drill-down button click for the given section key.
     * First click: streams detailed analysis into the panel.
     * Subsequent clicks: toggle panel visibility.
     */
    async function handleDrillDown(sectionKey) {
      const panel = document.getElementById('drillPanel-' + sectionKey);
      const card  = overviewDashboard.querySelector(`[data-section="${sectionKey}"]`);
      const btn   = card ? card.querySelector('.drill-down-btn') : null;
      const pre   = panel.querySelector('.drill-down-output');

      // Toggle if already fetched
      if (panel.dataset.fetched === 'true') {
        const visible = panel.style.display !== 'none';
        panel.style.display = visible ? 'none' : 'block';
        if (btn) btn.textContent = visible ? 'Details' : 'Hide';
        return;
      }

      const risk = currentOverview && currentOverview.risks
        ? currentOverview.risks[sectionKey]
        : null;
      if (!risk) return;

      // Extract relevant paragraphs
      const paragraphText = extractParagraphsByNumber(risk.paragraphs || []);

      // Extract claims text
      let claimsText = '';
      if (currentParsedDoc) {
        const claimsSec = currentParsedDoc.sections.find(s => s.type === 'claims');
        if (claimsSec && claimsSec.claims) {
          claimsText = claimsSec.claims.map(c => c.number + '. ' + c.text).join('\n');
        }
      }

      const prompt = buildDrillDownPrompt(sectionKey, risk, paragraphText, claimsText);

      panel.style.display = 'block';
      pre.textContent = '';
      if (btn) { btn.textContent = 'Analyzing\u2026'; btn.classList.add('loading'); }

      const DRILLDOWN_SYSTEM = 'You are a patent attorney assistant providing detailed analysis of a specific patentability issue. Be concrete, cite paragraph numbers, and provide actionable recommendations.';

      try {
        const usage = await LLMProvider.streamMessage(prompt, (chunk) => {
          pre.textContent += chunk;
          panel.scrollTop = panel.scrollHeight;
        }, { maxTokens: 2048, system: DRILLDOWN_SYSTEM });

        addUsage(usage);
        panel.dataset.fetched = 'true';
        if (btn) { btn.textContent = 'Hide'; btn.classList.remove('loading'); }
      } catch (err) {
        pre.textContent = 'Analysis failed: ' + err.message;
        panel.dataset.fetched = '';
        if (btn) { btn.textContent = 'Retry'; btn.classList.remove('loading'); }
      }
    }

    // =============================================================
    // DRAG & DROP WIRING
    // =============================================================

    // Prevent the browser from opening dropped files
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      document.addEventListener(evt, e => e.preventDefault());
    });

    dropZone.addEventListener('dragenter', () => dropZone.classList.add('drag-over'));
    dropZone.addEventListener('dragover',  () => dropZone.classList.add('drag-over'));

    dropZone.addEventListener('dragleave', e => {
      if (!dropZone.contains(e.relatedTarget)) {
        dropZone.classList.remove('drag-over');
      }
    });

    dropZone.addEventListener('drop', e => {
      const files = e.dataTransfer.files;
      if (!files || files.length === 0) return;
      handleFile(files[0]);
    });
  </script>

</body>
</html>
