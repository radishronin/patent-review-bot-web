<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patent Review</title>

  <!-- mammoth.js: converts .docx to plain text entirely client-side -->
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <!-- jszip: used by docx-parser to unzip .docx files client-side -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base:        #0e0e0e;
      --bg-surface:     #161616;
      --bg-raised:      #1f1f1f;
      --border:         #2e2e2e;
      --border-active:  #6b8cba;
      --text-primary:   #e8e4dc;
      --text-secondary: #8a8580;
      --text-muted:     #4a4845;
      --accent:         #4a6fa5;
      --accent-light:   #6b8cba;
      --success:        #4a7c59;
      --success-light:  #6aad80;
      --warning:        #7a6030;
      --warning-light:  #c8a050;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 2rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      margin-top: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-primary);
    }

    header p {
      margin-top: 0.6rem;
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .divider {
      width: 48px;
      height: 1px;
      background: var(--border);
      margin: 1.2rem auto;
    }

    /* ── Drop zone ─────────────────────────────────── */
    .drop-zone {
      width: 100%;
      max-width: 640px;
      background: var(--bg-surface);
      border: 1.5px dashed var(--border);
      border-radius: 4px;
      padding: 3.5rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      cursor: default;
      transition: border-color 0.2s ease, background-color 0.2s ease;
      position: relative;
      user-select: none;
    }

    .drop-zone.drag-over {
      border-color: var(--border-active);
      background-color: var(--bg-raised);
    }

    .drop-zone.accepted {
      border-style: solid;
      border-color: var(--success);
      background-color: var(--bg-raised);
    }

    .drop-icon {
      width: 48px;
      height: 48px;
      opacity: 0.35;
      transition: opacity 0.2s ease;
    }

    .drop-zone.drag-over .drop-icon,
    .drop-zone.accepted .drop-icon {
      opacity: 0.6;
    }

    .drop-zone.accepted .drop-icon path {
      stroke: var(--success-light);
    }

    .drop-label {
      font-size: 1rem;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
      text-align: center;
      line-height: 1.6;
    }

    .drop-label span {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
      font-style: italic;
    }

    .drop-zone.drag-over .drop-label {
      color: var(--text-primary);
    }

    /* ── File result card ──────────────────────────── */
    .file-result {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 1.5rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.25rem 1.5rem;
      align-items: center;
      gap: 1.25rem;
    }

    .file-result.visible {
      display: flex;
    }

    .file-result-icon {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      opacity: 0.7;
    }

    .file-result-icon path {
      stroke: var(--success-light);
    }

    .file-details {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 0.95rem;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    .file-meta {
      margin-top: 0.25rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .file-badge {
      flex-shrink: 0;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.7rem;
      border: 1px solid var(--success);
      color: var(--success-light);
      border-radius: 2px;
    }

    /* ── Status / error messages ───────────────────── */
    .status-msg {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 1rem;
      font-size: 0.82rem;
      font-style: italic;
      text-align: center;
    }

    .status-msg.visible   { display: block; }
    .status-msg.error     { color: #b06060; }
    .status-msg.working   { color: var(--text-muted); }

    /* ── Analysis section ──────────────────────────── */
    .analysis-section {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 2rem;
    }

    .analysis-section.visible {
      display: block;
    }

    .analysis-header {
      display: flex;
      align-items: baseline;
      gap: 1rem;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .analysis-header h2 {
      font-size: 0.72rem;
      font-weight: normal;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .analysis-header .section-label {
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent-light);
      font-style: normal;
    }

    /* Spinner shown while streaming/waiting */
    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid var(--border);
      border-top-color: var(--accent-light);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: auto;
      flex-shrink: 0;
    }

    .spinner.visible { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .analysis-output {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
      max-height: 520px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .analysis-output::-webkit-scrollbar {
      width: 6px;
    }

    .analysis-output::-webkit-scrollbar-track {
      background: transparent;
    }

    .analysis-output::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .analysis-output pre {
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Validation result ─────────────────────────── */
    .validation-result {
      display: none;
      width: 100%;
      max-width: 640px;
      margin-top: 1rem;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1rem 1.25rem;
    }

    .validation-result.visible { display: block; }

    .validation-result .val-errors {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .validation-result .val-errors li {
      font-size: 0.82rem;
      color: #b06060;
      font-style: italic;
      padding: 0.2rem 0;
      letter-spacing: 0.01em;
    }

    .validation-result .val-errors li::before {
      content: '✕  ';
      font-style: normal;
    }

    .validation-result .val-warnings {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .validation-result .val-warnings li {
      font-size: 0.82rem;
      color: var(--warning-light);
      font-style: italic;
      padding: 0.2rem 0;
      letter-spacing: 0.01em;
    }

    .validation-result .val-warnings li::before {
      content: '⚠  ';
      font-style: normal;
    }

    .validation-result .val-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 0.5rem;
    }

    .validation-result .val-warnings + .val-meta,
    .validation-result .val-errors + .val-meta {
      margin-top: 0.6rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    /* ── Footer ────────────────────────────────────── */
    footer {
      margin-top: 3.5rem;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Patent Review</h1>
    <div class="divider"></div>
    <p>Intelligent analysis for patent applications</p>
  </header>

  <!-- ── Phase 1: Drop zone ─────────────────────────── -->
  <div class="drop-zone" id="dropZone" role="region" aria-label="File drop zone">
    <svg class="drop-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 6h16l10 10v26H12V6z" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M28 6v10h10" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M18 22h12M18 28h12M18 34h8" stroke="var(--text-secondary)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <p class="drop-label">
      Drop your patent document here
      <span>.docx files only</span>
    </p>
  </div>

  <!-- ── Phase 1 result: file confirmation card ──────── -->
  <div class="file-result" id="fileResult">
    <svg class="file-result-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 6h12l8 8v16H8V6z" stroke="var(--success-light)" stroke-width="1.2" stroke-linejoin="round"/>
      <path d="M20 6v8h8" stroke="var(--success-light)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12 20l3.5 3.5L24 15" stroke="var(--success-light)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="file-details">
      <div class="file-name" id="fileName"></div>
      <div class="file-meta" id="fileMeta"></div>
    </div>
    <div class="file-badge">Received</div>
  </div>

  <!-- ── Phase 1.5: Validation result ────────────────── -->
  <div class="validation-result" id="validationResult"></div>

  <!-- ── Shared status / error line ──────────────────── -->
  <div class="status-msg" id="statusMsg"></div>

  <!-- ── Phase 2: Analysis output ────────────────────── -->
  <div class="analysis-section" id="analysisSection">
    <div class="analysis-header">
      <h2>Preliminary Review</h2>
      <span class="section-label">&sect;101 &middot; &sect;102 &middot; &sect;103 &middot; &sect;112</span>
      <div class="spinner" id="spinner"></div>
    </div>
    <div class="analysis-output">
      <pre id="analysisOutput"></pre>
    </div>
  </div>

  <footer>Patent Review System &mdash; Prototype</footer>

  <script>
    // =============================================================
    // CONFIG
    // TODO: Replace with your deployed Workers URL after running `wrangler deploy`.
    //       Format: https://patent-review-proxy.<your-subdomain>.workers.dev
    //       The API key lives in Cloudflare as a secret — never in this file.
    // =============================================================
    const PROXY_URL = 'https://patent-review-proxy.patent-review-bot.workers.dev';

    const MODEL = 'claude-opus-4-6'; // Most capable model for legal analysis

    // =============================================================
    // LLM PROVIDER ABSTRACTION
    // Swap out this object to change providers without touching
    // the rest of the application logic.
    // =============================================================
    const LLMProvider = {
      /**
       * Send a user message and receive a streamed text response.
       * Yields chunks via the onChunk callback as they arrive.
       *
       * @param {string}   userMessage  - The full prompt text to send.
       * @param {Function} onChunk      - Called with each text delta string.
       * @returns {Promise<void>}
       */
      async streamMessage(userMessage, onChunk) {
        // POST to the Cloudflare Worker proxy — no API key in the browser
        const response = await fetch(PROXY_URL, {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
          },
          body: JSON.stringify({
            model: MODEL,
            max_tokens: 2048,
            stream: true,
            messages: [
              { role: 'user', content: userMessage }
            ],
          }),
        });

        if (!response.ok) {
          const body = await response.text();
          throw new Error(`API error ${response.status}: ${body}`);
        }

        // Parse the SSE stream
        const reader  = response.body.getReader();
        const decoder = new TextDecoder();
        let   buffer  = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          // SSE events are separated by double newlines
          const events = buffer.split('\n\n');
          buffer = events.pop(); // keep any incomplete trailing event

          for (const event of events) {
            const dataLine = event.split('\n').find(l => l.startsWith('data:'));
            if (!dataLine) continue;

            const raw = dataLine.slice(5).trim();
            if (raw === '[DONE]') return;

            let parsed;
            try { parsed = JSON.parse(raw); } catch { continue; }

            if (parsed.type === 'content_block_delta' &&
                parsed.delta?.type === 'text_delta') {
              onChunk(parsed.delta.text);
            }
          }
        }
      },
    };

    // =============================================================
    // PROMPT
    // =============================================================
    const REVIEW_STRUCTURE = `Structure your analysis under four headings:

## §101 — Subject Matter Eligibility
Assess whether the claimed invention falls within a statutory category (process, machine, manufacture, or composition of matter) and whether it is directed to patent-eligible subject matter under Alice/Mayo.

## §102 — Novelty
Identify any claim elements or combinations that may lack novelty. Note any apparent prior art concerns based on the document's own disclosures or well-known public domain knowledge.

## §103 — Obviousness
Evaluate whether the claimed invention would have been obvious to a person of ordinary skill in the art (POSITA) at the time of filing. Consider motivation to combine, secondary considerations, etc.

## §112 — Written Description & Enablement
Review whether the specification adequately supports the claims (written description) and whether it enables a POSITA to make and use the invention without undue experimentation.

Conclude with a brief **Summary of Key Risks** and suggested next steps.`;

    /**
     * Build the LLM review prompt.
     * Accepts either a plain string (mammoth fallback) or a ParsedPatentDocument
     * (structured parser path). In the structured case the prompt includes
     * document metadata and instructs the model to cite [XXXX] paragraph numbers.
     *
     * @param {string | object} docTextOrStructured
     * @returns {string}
     */
    function buildReviewPrompt(docTextOrStructured) {
      const preamble = 'You are a patent attorney assistant with expertise in U.S. patent law. ' +
        'Perform a preliminary patentability review of the following patent application document.';

      if (typeof docTextOrStructured === 'string') {
        return `${preamble}\n\n${REVIEW_STRUCTURE}\n\n---\nPATENT APPLICATION DOCUMENT:\n${docTextOrStructured}`;
      }

      // Structured document path
      const doc         = docTextOrStructured;
      const claimsSection = doc.sections.find(s => s.type === 'claims');
      const claimCount  = claimsSection ? claimsSection.claims.length : 0;
      const sectionHeadings = doc.sections
        .filter(s => s.type === 'section' && s.heading)
        .map(s => s.heading)
        .join(', ');

      let claimDepSummary = '';
      if (claimsSection && claimsSection.claims.length > 0) {
        const deps = claimsSection.claims
          .filter(c => c.dependsOn !== null)
          .map(c => `Claim ${c.number} → Claim ${c.dependsOn}`)
          .join(', ');
        if (deps) claimDepSummary = '\n- Claim dependencies: ' + deps;
      }

      const metadata = [
        'DOCUMENT METADATA:',
        '- Title: ' + (doc.title || 'Unknown'),
        '- Numbered paragraphs: ' + doc.metadata.totalNumberedParagraphs,
        '- Sections detected: ' + (sectionHeadings || 'none identified'),
        '- Claims: ' + claimCount + claimDepSummary,
      ].join('\n');

      return `${preamble}

${metadata}

When referencing specific content, cite paragraph numbers (e.g., [0023]) where available.

${REVIEW_STRUCTURE}

---
PATENT APPLICATION DOCUMENT:
${doc.fullTextWithNumbers}`;
    }

    // =============================================================
    // PATENT VALIDATOR
    // Inline copy of src/patent-validator.js — do not edit here.
    // The canonical, testable source lives in src/patent-validator.js.
    // =============================================================
    (function () {
      const CLAIMS_PATTERNS = [
        /^\s*claims\s*$/im,
        /^\s*what\s+is\s+claimed\s+is\s*:/im,
        /^\s*what\s+is\s+claimed\s*:/im,
        /^\s*i\s+claim\s*:/im,
        /^\s*we\s+claim\s*:/im,
      ];

      const SECTION_CHECKS = [
        {
          key: 'hasAbstract',
          name: 'Abstract',
          patterns: [/abstract\s+of\s+the\s+disclosure/i, /\babstract\b/i],
        },
        {
          key: 'hasBackground',
          name: 'Background',
          patterns: [
            /background\s+of\s+the\s+invention/i,
            /field\s+of\s+the\s+invention/i,
            /technical\s+field/i,
            /\bbackground\b/i,
          ],
        },
        {
          key: 'hasSummary',
          name: 'Summary',
          patterns: [/summary\s+of\s+the\s+invention/i, /\bsummary\b/i],
        },
        {
          key: 'hasBriefDescription',
          name: 'Brief Description of Drawings',
          patterns: [
            /brief\s+description\s+of\s+the\s+drawings/i,
            /brief\s+description\s+of\s+the\s+figures/i,
            /description\s+of\s+the\s+drawings/i,
          ],
        },
        {
          key: 'hasDetailedDescription',
          name: 'Detailed Description',
          patterns: [
            /detailed\s+description\s+of\s+the\s+invention/i,
            /description\s+of\s+embodiments/i,
            /description\s+of\s+the\s+preferred\s+embodiment/i,
            /detailed\s+description/i,
          ],
        },
      ];

      const PARAGRAPH_MARKER_RE = /\[0{0,3}\d+\]/g;

      function detectSection(lines, patterns) {
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          for (const pat of patterns) {
            if (pat.test(trimmed)) return true;
          }
        }
        return false;
      }

      function detectClaims(lines) {
        for (const line of lines) {
          for (const pat of CLAIMS_PATTERNS) {
            if (pat.test(line)) return true;
          }
        }
        return false;
      }

      function extractTitle(lines) {
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) continue;
          if (PARAGRAPH_MARKER_RE.test(trimmed)) { PARAGRAPH_MARKER_RE.lastIndex = 0; continue; }
          PARAGRAPH_MARKER_RE.lastIndex = 0;
          if (/^(abstract|background|summary|claims|field|technical\s+field|detailed\s+description|brief\s+description)/i.test(trimmed)) continue;
          return trimmed;
        }
        return null;
      }

      window.validatePatentDocument = function validatePatentDocument(rawText) {
        const errors = [];
        const warnings = [];
        const trimmed = typeof rawText === 'string' ? rawText.trim() : '';

        if (trimmed.length < 500) {
          errors.push('Document is too short to be a patent application (less than 500 characters).');
          return {
            isValid: false, errors, warnings,
            metadata: {
              title: null, paragraphCount: 0, hasClaimsSection: false,
              hasAbstract: false, hasDetailedDescription: false, hasSummary: false,
              hasBackground: false, hasBriefDescription: false,
              estimatedTokenCount: Math.ceil(trimmed.length / 4),
            },
          };
        }

        const lines = trimmed.split('\n');
        const hasClaimsSection = detectClaims(lines);
        if (!hasClaimsSection) {
          errors.push('No claims section detected. A patent application must include a claims section.');
        }

        const markerMatches = trimmed.match(PARAGRAPH_MARKER_RE) || [];
        const paragraphCount = markerMatches.length;
        if (paragraphCount === 0) {
          warnings.push('No numbered paragraphs ([XXXX]) detected. Paragraph-level feedback will not be available.');
        }

        const sectionResults = {};
        for (const section of SECTION_CHECKS) {
          const found = detectSection(lines, section.patterns);
          sectionResults[section.key] = found;
          if (!found) {
            warnings.push('No ' + section.name + ' section detected.');
          }
        }

        return {
          isValid: errors.length === 0,
          errors,
          warnings,
          metadata: {
            title: extractTitle(lines),
            paragraphCount,
            hasClaimsSection,
            hasAbstract:            sectionResults.hasAbstract,
            hasDetailedDescription: sectionResults.hasDetailedDescription,
            hasSummary:             sectionResults.hasSummary,
            hasBackground:          sectionResults.hasBackground,
            hasBriefDescription:    sectionResults.hasBriefDescription,
            estimatedTokenCount:    Math.ceil(trimmed.length / 4),
          },
        };
      };
    })();

    // =============================================================
    // DOCX PARSER
    // Inline copy of src/docx-parser.js — do not edit here.
    // The canonical, testable source lives in src/docx-parser.js.
    // =============================================================
    (function () {
      const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
      const M_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/math';

      function parseXml(str) {
        return new DOMParser().parseFromString(str, 'application/xml');
      }
      function firstChild(el, ln) {
        for (const n of el.childNodes) if (n.nodeType === 1 && n.localName === ln) return n;
        return null;
      }
      function wVal(el) {
        if (!el) return null;
        return el.getAttribute('w:val') ?? el.getAttributeNS(W_NS, 'val') ?? null;
      }

      function resolveNumbering(numberingXml, stylesXml) {
        const numDoc = parseXml(numberingXml), stylesDoc = parseXml(stylesXml);
        let abstractId = null;
        for (const an of numDoc.getElementsByTagNameNS(W_NS, 'abstractNum')) {
          for (const lvl of an.getElementsByTagNameNS(W_NS, 'lvl')) {
            const ilvl = lvl.getAttribute('w:ilvl') ?? lvl.getAttributeNS(W_NS, 'ilvl');
            if (ilvl !== '0') continue;
            const val = wVal(firstChild(lvl, 'lvlText'));
            if (val && val.includes('[%1]')) {
              abstractId = an.getAttribute('w:abstractNumId') ?? an.getAttributeNS(W_NS, 'abstractNumId');
              break;
            }
          }
          if (abstractId !== null) break;
        }
        if (abstractId === null) return null;
        let numId = null;
        for (const num of numDoc.getElementsByTagNameNS(W_NS, 'num')) {
          if (wVal(firstChild(num, 'abstractNumId')) === abstractId) {
            numId = num.getAttribute('w:numId') ?? num.getAttributeNS(W_NS, 'numId');
            break;
          }
        }
        if (numId === null) return null;
        const styleNames = new Set();
        for (const style of stylesDoc.getElementsByTagNameNS(W_NS, 'style')) {
          const pPr = firstChild(style, 'pPr'), numPr = pPr ? firstChild(pPr, 'numPr') : null;
          if (!numPr) continue;
          if (wVal(firstChild(numPr, 'numId')) !== numId) continue;
          const nv = wVal(firstChild(style, 'name')); if (nv) styleNames.add(nv);
          const sid = style.getAttribute('w:styleId') ?? style.getAttributeNS(W_NS, 'styleId');
          if (sid) styleNames.add(sid);
        }
        return { numId, styleNames };
      }

      function extractParagraphText(pEl) {
        const parts = []; _collectText(pEl, parts, true); return parts.join('');
      }
      function _collectText(el, parts, skipPPr) {
        for (const n of el.childNodes) {
          if (n.nodeType !== 1) continue;
          const ln = n.localName;
          if (skipPPr && (ln === 'pPr' || ln === 'rPr')) continue;
          if (ln === 'rPr') continue;
          if (ln === 't') parts.push(n.textContent);
          else if (ln === 'tab') parts.push('\t');
          else _collectText(n, parts, false);
        }
      }

      function parseClaims(claimParas) {
        const claims = []; let cur = null;
        for (const para of claimParas) {
          const t = para.text.trim(); if (!t) continue;
          if (/^(what\s+is\s+claimed\s+is\s*:|claims?\s*$|i\s+claim\s*:|we\s+claim\s*:)/i.test(t)) continue;
          const m = t.match(/^(\d+)\.\s*/);
          if (m) {
            if (cur) claims.push(cur);
            const body = t.slice(m[0].length);
            const dm = body.match(/\bclaims?\s+(\d+)/i);
            cur = { number: parseInt(m[1], 10), text: body, dependsOn: dm ? parseInt(dm[1], 10) : null };
          } else if (cur) { cur.text += '\n' + t; }
        }
        if (cur) claims.push(cur); return claims;
      }

      function _hasBold(rPr) {
        const b = firstChild(rPr, 'b'); if (!b) return false;
        const v = wVal(b); return v === null || v === '' || v === 'true' || v === '1';
      }
      function _isBoldPara(pEl) {
        const pPr = firstChild(pEl, 'pPr');
        if (pPr) { const rPr = firstChild(pPr, 'rPr'); if (rPr && _hasBold(rPr)) return true; }
        for (const n of pEl.childNodes) {
          if (n.nodeType === 1 && n.localName === 'r') {
            const rPr = firstChild(n, 'rPr'); if (rPr && _hasBold(rPr)) return true;
          }
        }
        return false;
      }

      function parseFrontMatter(paragraphs) {
        let title = null; const inventors = []; let docketNumber = null, clientRef = null;
        let forIdx = -1;
        for (let i = 0; i < paragraphs.length; i++) {
          if (/^for$/i.test(paragraphs[i].text.trim()) && paragraphs[i].isCentered) { forIdx = i; break; }
        }
        if (forIdx >= 0) {
          for (let i = forIdx + 1; i < paragraphs.length; i++) {
            const p = paragraphs[i]; if (!p.text.trim()) continue;
            if (p.isCentered && p.isBold) { title = p.text.trim(); break; }
          }
        }
        let invIdx = -1;
        for (let i = 0; i < paragraphs.length; i++) {
          if (/^inventors?:\s*$/i.test(paragraphs[i].text.trim())) { invIdx = i; break; }
        }
        if (invIdx >= 0) {
          for (let i = invIdx + 1; i < paragraphs.length; i++) {
            const p = paragraphs[i]; const t = p.text.trim(); if (!t) continue;
            if (/attorney\s+docket|client\s+ref|docket\s+no|phone|fax|\d{3}[-.\s]\d{3}/i.test(t)) break;
            if (p.isBold && /:\s*$/.test(t)) break;
            if (p.isCentered && !p.isBold) inventors.push(t);
          }
        }
        for (const p of paragraphs) {
          const t = p.text.trim();
          if (!docketNumber) { const m = t.match(/attorney\s+docket\s+(?:no\.?|number)?\s*:?\s*(.+)/i); if (m) docketNumber = m[1].trim(); }
          if (!clientRef)    { const m = t.match(/client\s+ref(?:erence)?\s+(?:no\.?|number)?\s*:?\s*(.+)/i); if (m) clientRef = m[1].trim(); }
        }
        return { title, inventors, docketNumber, clientRef };
      }

      function _isSectionHeading(para) {
        const s = (para.style || '').toLowerCase();
        if (s === 'section' || s === 'sectionheading' || s.includes('section')) return true;
        if (para.isCentered && para.number === null)
          return /^(background|field|summary|brief description|detailed description|description of|drawings|technical field|cross.reference)/i.test(para.text.trim());
        return false;
      }

      function classifySections(paragraphs) {
        const sections = []; let cur = null, mode = 'start', claimParas = [];
        const pushSection = () => {
          if (!cur) return;
          if (cur.type === 'front-matter') { const fm = parseFrontMatter(cur.paragraphs); Object.assign(cur, fm); }
          sections.push(cur); cur = null;
        };
        const pushClaims = () => {
          if (claimParas.length > 0) { sections.push({ type: 'claims', heading: null, paragraphs: undefined, claims: parseClaims(claimParas), text: null }); claimParas = []; }
        };
        const flush = () => { if (mode === 'claims') pushClaims(); else pushSection(); };
        for (const para of paragraphs) {
          const t = para.text.trim(); if (!t) continue;
          if (/^what\s+is\s+claimed\s+is\s*:/i.test(t) || /^\s*claims\s*$/i.test(t) || /^\s*i\s+claim\s*:/i.test(t) || /^\s*we\s+claim\s*:/i.test(t)) {
            flush(); mode = 'claims'; claimParas = [para]; continue;
          }
          if (/^abstract$/i.test(t) && para.isCentered) {
            flush(); mode = 'abstract'; cur = { type: 'abstract', heading: null, paragraphs: undefined, claims: undefined, text: '' }; continue;
          }
          if (mode === 'claims')   { claimParas.push(para); continue; }
          if (mode === 'abstract') { cur.text = cur.text ? cur.text + '\n' + t : t; continue; }
          if (_isSectionHeading(para)) {
            pushSection(); mode = 'section'; cur = { type: 'section', heading: t, paragraphs: [], claims: undefined, text: null }; continue;
          }
          if (!cur) { mode = 'front-matter'; cur = { type: 'front-matter', heading: null, paragraphs: [], claims: undefined, text: null }; }
          cur.paragraphs.push(para);
        }
        if (mode === 'claims') pushClaims(); else pushSection();
        return sections;
      }

      function _isNumberedPara(pEl, numId, styleNames) {
        const pPr = firstChild(pEl, 'pPr'); if (!pPr) return false;
        const styleName = wVal(firstChild(pPr, 'pStyle'));
        if (styleName && styleNames.has(styleName)) {
          const numPr = firstChild(pPr, 'numPr'), numIdEl = numPr ? firstChild(numPr, 'numId') : null;
          return !(numIdEl && wVal(numIdEl) === '0');
        }
        const numPr = firstChild(pPr, 'numPr'), numIdEl = numPr ? firstChild(numPr, 'numId') : null;
        return wVal(numIdEl) === numId;
      }
      function _getStyle(pEl) { const pPr = firstChild(pEl, 'pPr'); return wVal(pPr ? firstChild(pPr, 'pStyle') : null) || 'Normal'; }
      function _isCentered(pEl) { const pPr = firstChild(pEl, 'pPr'); if (!pPr) return false; return wVal(firstChild(pPr, 'jc')) === 'center'; }
      function _tblText(tbl) { const p = []; _collectText(tbl, p, false); return p.join('').trim(); }

      function _buildFullText(sections) {
        const lines = [];
        for (const s of sections) {
          if (s.type === 'front-matter') {
            for (const p of (s.paragraphs || [])) lines.push(p.number ? p.number + ' ' + p.text : p.text);
          } else if (s.type === 'section') {
            lines.push(''); lines.push(s.heading || '');
            for (const p of (s.paragraphs || [])) lines.push(p.number ? p.number + ' ' + p.text : p.text);
          } else if (s.type === 'claims') {
            lines.push(''); lines.push('CLAIMS'); lines.push('What is claimed is:');
            for (const c of (s.claims || [])) lines.push(c.number + '. ' + c.text);
          } else if (s.type === 'abstract') {
            lines.push(''); lines.push('ABSTRACT'); if (s.text) lines.push(s.text);
          }
        }
        return lines.join('\n').trim();
      }

      async function parsePatentDocx(arrayBuffer) {
        const zip = await JSZip.loadAsync(arrayBuffer);
        const [documentXml, numberingXml, stylesXml] = await Promise.all([
          zip.file('word/document.xml')?.async('string')  ?? Promise.resolve(null),
          zip.file('word/numbering.xml')?.async('string') ?? Promise.resolve(null),
          zip.file('word/styles.xml')?.async('string')    ?? Promise.resolve(null),
        ]);
        if (!documentXml) return null;
        const numInfo = numberingXml && stylesXml ? resolveNumbering(numberingXml, stylesXml) : null;
        if (!numInfo) return null;
        const { numId, styleNames } = numInfo;
        const body = parseXml(documentXml).getElementsByTagNameNS(W_NS, 'body')[0];
        if (!body) return null;
        let counter = 0; const rawParagraphs = [];
        for (const child of body.childNodes) {
          if (child.nodeType !== 1) continue;
          const ln = child.localName;
          if (ln === 'p') {
            const text = extractParagraphText(child); if (!text.trim()) continue;
            const numbered = _isNumberedPara(child, numId, styleNames);
            const number = numbered ? '[' + String(++counter).padStart(4, '0') + ']' : null;
            rawParagraphs.push({ number, text, style: _getStyle(child), isCentered: _isCentered(child), isBold: _isBoldPara(child) });
          } else if (ln === 'tbl') {
            const text = _tblText(child); if (text) rawParagraphs.push({ number: null, text, style: 'Table', isCentered: false, isBold: false });
          }
        }
        if (counter === 0) return null;
        const sections = classifySections(rawParagraphs);
        const fullTextWithNumbers = _buildFullText(sections);
        const fm = sections.find(s => s.type === 'front-matter');
        return {
          title: (fm && fm.title) ? fm.title : null,
          sections,
          metadata: {
            totalNumberedParagraphs: counter,
            estimatedTokenCount: Math.ceil(fullTextWithNumbers.length / 4),
            hasClaimsSection: sections.some(s => s.type === 'claims'),
            hasAbstract:      sections.some(s => s.type === 'abstract'),
          },
          fullTextWithNumbers,
        };
      }

      window.parsePatentDocx = parsePatentDocx;
    })();

    // =============================================================
    // UI HELPERS
    // =============================================================
    const dropZone        = document.getElementById('dropZone');
    const fileResult      = document.getElementById('fileResult');
    const fileNameEl      = document.getElementById('fileName');
    const fileMetaEl      = document.getElementById('fileMeta');
    const validationResult = document.getElementById('validationResult');
    const statusMsg       = document.getElementById('statusMsg');
    const analysisSection = document.getElementById('analysisSection');
    const analysisOutput  = document.getElementById('analysisOutput');
    const spinner         = document.getElementById('spinner');

    function formatBytes(bytes) {
      if (bytes < 1024)            return bytes + ' B';
      if (bytes < 1024 * 1024)    return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
    }

    function setStatus(msg, type /* 'error' | 'working' | '' */) {
      statusMsg.textContent = msg;
      statusMsg.className   = 'status-msg' + (msg ? ' visible' : '');
      if (type) statusMsg.classList.add(type);
    }

    function setSpinner(active) {
      spinner.classList.toggle('visible', active);
    }

    // =============================================================
    // CORE FLOW
    // =============================================================

    /** Append the metadata summary to #validationResult when we have a structured doc. */
    function appendRichMeta(parsedDoc) {
      const claimsSection = parsedDoc.sections.find(s => s.type === 'claims');
      const claimCount    = claimsSection ? claimsSection.claims.length : 0;

      const line1 = document.createElement('div');
      line1.className = 'val-meta';
      line1.textContent =
        parsedDoc.metadata.totalNumberedParagraphs + ' numbered paragraph' +
        (parsedDoc.metadata.totalNumberedParagraphs !== 1 ? 's' : '') +
        ' \u00b7 ~' + parsedDoc.metadata.estimatedTokenCount.toLocaleString() + ' tokens' +
        (claimCount ? ' \u00b7 ' + claimCount + ' claim' + (claimCount !== 1 ? 's' : '') : '');
      validationResult.appendChild(line1);

      const detectedHeadings = parsedDoc.sections
        .filter(s => s.type === 'section' && s.heading)
        .map(s => s.heading);
      if (detectedHeadings.length > 0) {
        const line2 = document.createElement('div');
        line2.className = 'val-meta';
        line2.style.marginTop = '0.2rem';
        line2.textContent = detectedHeadings.join(' \u00b7 ');
        validationResult.appendChild(line2);
      }
    }

    /** Append the basic (regex-based) metadata summary. */
    function appendBasicMeta(metadata) {
      const metaEl = document.createElement('div');
      metaEl.className = 'val-meta';
      metaEl.textContent =
        metadata.paragraphCount + ' numbered paragraph' +
        (metadata.paragraphCount !== 1 ? 's' : '') +
        ' \u00b7 ~' + metadata.estimatedTokenCount.toLocaleString() + ' tokens';
      validationResult.appendChild(metaEl);
    }

    async function handleFile(file) {
      // ── Clear previous results ─────────────────────────────────
      validationResult.className = 'validation-result';
      validationResult.innerHTML = '';
      analysisOutput.textContent = '';
      analysisSection.classList.remove('visible');

      // ── Validate file type ─────────────────────────────────────
      const isDocx = file.name.toLowerCase().endsWith('.docx') ||
                     file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
      if (!isDocx) {
        setStatus('Only .docx files are supported. Please drop a Word document.', 'error');
        fileResult.classList.remove('visible');
        dropZone.classList.remove('drag-over', 'accepted');
        return;
      }

      // ── Phase 1: show file confirmation ───────────────────────
      setStatus('');
      fileNameEl.textContent = file.name;
      fileMetaEl.textContent = formatBytes(file.size);
      fileResult.classList.add('visible');
      dropZone.classList.remove('drag-over');
      dropZone.classList.add('accepted');

      // ── Phase 2a: read bytes, try structured parser first ─────
      setStatus('Extracting document text\u2026', 'working');

      let arrayBuffer;
      try {
        arrayBuffer = await file.arrayBuffer();
      } catch (err) {
        setStatus('Failed to read document: ' + err.message, 'error');
        return;
      }

      let parsedDoc = null;
      let docText   = null;

      try {
        parsedDoc = await parsePatentDocx(arrayBuffer);
      } catch (err) {
        console.warn('Structured parser failed, falling back to mammoth:', err);
      }

      if (parsedDoc) {
        // Structured parse succeeded — use fullTextWithNumbers as the text
        docText = parsedDoc.fullTextWithNumbers;
        // Enrich the file card with the detected title
        if (parsedDoc.title) {
          fileMetaEl.textContent = parsedDoc.title + ' \u00b7 ' + formatBytes(file.size);
        }
      } else {
        // Fallback: mammoth plain-text extraction
        try {
          const result = await mammoth.extractRawText({ arrayBuffer });
          docText = result.value.trim();
        } catch (err) {
          setStatus('Failed to read document: ' + err.message, 'error');
          return;
        }
      }

      if (!docText) {
        setStatus('Document appears to be empty or could not be parsed.', 'error');
        return;
      }

      // ── Phase 1.5: validate patent structure ──────────────────
      const validation = validatePatentDocument(docText);
      const { isValid, errors: valErrors, warnings: valWarnings, metadata } = validation;

      if (!isValid) {
        const ul = document.createElement('ul');
        ul.className = 'val-errors';
        valErrors.forEach(msg => {
          const li = document.createElement('li'); li.textContent = msg; ul.appendChild(li);
        });
        validationResult.appendChild(ul);
        validationResult.classList.add('visible');
        setStatus('');
        return;
      }

      // Warnings list (if any)
      if (valWarnings.length > 0) {
        const ul = document.createElement('ul');
        ul.className = 'val-warnings';
        valWarnings.forEach(msg => {
          const li = document.createElement('li'); li.textContent = msg; ul.appendChild(li);
        });
        validationResult.appendChild(ul);
      }

      // Metadata summary — richer when structured parse succeeded
      if (parsedDoc) {
        appendRichMeta(parsedDoc);
      } else {
        appendBasicMeta(metadata);
      }
      validationResult.classList.add('visible');

      // ── Phase 2b: send to LLM, stream response ────────────────
      setStatus('Sending to model for analysis\u2026', 'working');
      analysisSection.classList.add('visible');
      analysisOutput.textContent = '';
      setSpinner(true);

      // Use structured doc for prompt when available (includes [XXXX] numbers)
      const prompt = buildReviewPrompt(parsedDoc || docText);

      try {
        await LLMProvider.streamMessage(prompt, (chunk) => {
          analysisOutput.textContent += chunk;
          const outputBox = analysisOutput.parentElement;
          outputBox.scrollTop = outputBox.scrollHeight;
        });
        setStatus('');
      } catch (err) {
        setStatus('Analysis failed: ' + err.message, 'error');
      } finally {
        setSpinner(false);
      }
    }

    // =============================================================
    // DRAG & DROP WIRING
    // =============================================================

    // Prevent the browser from opening dropped files
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      document.addEventListener(evt, e => e.preventDefault());
    });

    dropZone.addEventListener('dragenter', () => dropZone.classList.add('drag-over'));
    dropZone.addEventListener('dragover',  () => dropZone.classList.add('drag-over'));

    dropZone.addEventListener('dragleave', e => {
      if (!dropZone.contains(e.relatedTarget)) {
        dropZone.classList.remove('drag-over');
      }
    });

    dropZone.addEventListener('drop', e => {
      const files = e.dataTransfer.files;
      if (!files || files.length === 0) return;
      handleFile(files[0]);
    });
  </script>

</body>
</html>
