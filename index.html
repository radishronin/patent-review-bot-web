<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patent Suite</title>
<style>
  :root {
    --bg-base: #0e0e0e;
    --bg-surface: #161616;
    --bg-raised: #1f1f1f;
    --border: #2e2e2e;
    --text-primary: #e8e4dc;
    --text-secondary: #8a8580;
    --text-muted: #4a4845;
    --accent-light: #6b8cba;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 5rem 1.5rem 6rem;
  }
  header {
    text-align: center;
    margin-bottom: 4rem;
  }
  header h1 {
    font-size: 2.6rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    margin: 0 0 1.25rem;
    color: var(--text-primary);
  }
  .divider {
    width: 64px;
    height: 1px;
    background: var(--border);
    margin: 0 auto 1.25rem;
  }
  header p {
    font-style: italic;
    color: var(--text-secondary);
    font-size: 1.05rem;
    margin: 0;
  }
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    justify-content: center;
  }
  .card {
    flex: 1 1 260px;
    max-width: 300px;
    display: block;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.75rem 1.5rem;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s;
  }
  .card:hover {
    border-color: var(--accent-light);
    background: var(--bg-raised);
  }
  .card h2 {
    font-size: 1.15rem;
    font-weight: 400;
    margin: 0 0 0.75rem;
    color: var(--text-primary);
  }
  .card p {
    font-size: 0.9rem;
    line-height: 1.5;
    color: var(--text-secondary);
    margin: 0;
  }
</style>
<script src="shared/nav.js" data-root="."></script>
</head>
<body>
  <main>
    <header>
      <h1>Patent Suite</h1>
      <div class="divider"></div>
      <p>A local toolkit for patent preparation and prosecution</p>
    </header>
    <div class="cards">
      <a class="card" href="review/">
        <h2>Patent Review</h2>
        <p>Structured &sect;101/&sect;102/&sect;103/&sect;112 triage of a .docx application.</p>
      </a>
      <a class="card" href="oar/">
        <h2>OA Response Builder</h2>
        <p>Offline skeleton generator for Office Action responses.</p>
      </a>
      <a class="card" href="print/">
        <h2>First-Print</h2>
        <p>Offline first-draft printer for application specifications.</p>
      </a>
    </div>
  </main>
</body>
</html>
